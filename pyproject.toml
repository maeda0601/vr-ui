[project]
name = "vr-ui"
version = "0.1.0"
description = "Webカメラのハンドトラッキング（MediaPipe）でWindowsのマウスを操作するツール"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    # 手の21点検出（Tasks API）。依存で opencv-contrib-python も入る
    "mediapipe>=1.0.0",
    # imshow 付きの OpenCV。mediapipe が入れる contrib 版と同じ系統に揃え、
    # opencv-python との二重インストール（cv2 の取り合い）を避ける
    "opencv-contrib-python>=4.8",
    "numpy>=1.24",
    # 日本語テキスト描画とオーバーレイの合成
    "Pillow>=10.0",
]

# スクリプト集なのでパッケージとしてはインストールしない（uv run scripts/... で実行する）
[tool.uv]
package = false

[dependency-groups]
# 開発用（uv sync で入る。本体の実行には不要）
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# 既定の fd レベルの出力キャプチャだと、設定画面（Tk）の起動がときどき失敗して
# テストが skip になる（3回に1回程度）。Python レベルのキャプチャなら安定する
addopts = "--capture=sys"
# scripts/ のモジュール（hand_mouse, hm_core, download_model）をそのまま import する
pythonpath = ["scripts"]
